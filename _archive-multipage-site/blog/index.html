<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Denver Home Buying Guides &amp; Energy Tips | redT Homes</title>
  <meta name="description" content="Buying guides, sustainability and energy efficiency tips, neighborhood spotlights, and homeowner resources from redT Homes, Denver's healthier homebuilder.">
  <link rel="canonical" href="https://www.redthomes.com/blog/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="redT Homes">
  <meta property="og:title" content="redT Homes Blog | Denver Home Buying Guides &amp; Energy Tips">
  <meta property="og:description" content="Buying guides, sustainability tips, neighborhood spotlights, and homeowner resources from redT Homes.">
  <meta property="og:url" content="https://www.redthomes.com/blog/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="redT Homes Blog | Denver Home Buying Guides &amp; Energy Tips">
  <meta name="twitter:description" content="Buying guides, sustainability tips, neighborhood spotlights, and homeowner resources from redT Homes.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.redthomes.com/" },
      { "@type": "ListItem", "position": 2, "name": "Blog", "item": "https://www.redthomes.com/blog/" }
    ]
  }
  </script>
</head>
<body>
  <!-- BUILD:INCLUDE partials/header.html -->

  <main id="main">
    <nav class="breadcrumbs container" aria-label="Breadcrumb">
      <ol>
        <li><a href="/">Home</a></li>
        <li aria-current="page">Blog</li>
      </ol>
    </nav>

    <section style="padding-top: var(--space-4);">
      <div class="container">
        <p class="eyebrow">The redT Blog</p>
        <h1>Buying Guides, Energy Tips &amp; Neighborhood Spotlights</h1>
        <p class="lede">Everything we've learned building healthier homes in Denver, for buyers deciding whether new construction is right for them.</p>

        <div class="grid">
          {{#each posts}}
          <article class="card">
            <a href="{{url}}" style="color: inherit; text-decoration: none;">
              <div class="card-media">
                <img src="{{image}}" alt="{{imageAlt}}" width="400" height="300">
              </div>
              <div class="card-body">
                <p class="card-eyebrow">{{category}} &middot; {{date}}</p>
                <h2 class="mb-0" style="font-size: var(--step-1);">{{title}}</h2>
                <p class="text-muted">{{excerpt}}</p>
              </div>
            </a>
          </article>
          {{/each}}
        </div>
      </div>
    </section>
  </main>

  <!-- BUILD:INCLUDE partials/footer.html -->
</body>
</html>
