[build]
  publish = "dist"
  command = "node build.js"

[[redirects]]
  from = "/homes"
  to = "/homes/index.html"
  status = 200

[[redirects]]
  from = "/neighborhoods"
  to = "/neighborhoods/index.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
