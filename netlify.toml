# Catch-all for the old WordPress media library. migrate-wp-images.js already
# downloaded every image referenced in data/blog.json / data/team.json to
# /assets/images/wp-import/ and rewrote those files to use the local copies —
# so this isn't about missing files, it's about *inbound* requests for the old
# absolute redthomes.com/wp-content/uploads/... URLs that outlive the content
# rewrite: search-engine caches of pre-migration pages, social-preview
# crawlers, and other sites hotlinking these images directly. Confirmed via a
# real GA4 page-path export (2026-08-04 to 2026-08-07, post-cutover) — ~26 of
# that period's ~46 total 404 views were distinct /wp-content/uploads/* paths,
# each for an image that already exists under wp-import/ at a (possibly
# differently-sized) filename, e.g. the 404'd
# .../2022/07/AdobeStock_108318181-768x512.jpeg vs. the real local
# .../2022/07/AdobeStock_108318181-300x200.jpeg. A generic wildcard is used
# instead of per-file redirects (impractical at this volume, and new stale
# requests keep surfacing) — same "safe fallback to homepage" pattern as
# every other no-current-equivalent redirect in this file. This also
# subsumes the specific PDF redirects immediately below (kept as-is rather
# than removed, since they're harmless duplicates and this rule doesn't need
# to be the only thing covering them).
[[redirects]]
  from = "/wp-content/uploads/*"
  to = "/"
  status = 301

