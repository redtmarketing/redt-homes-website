[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HubSpot's default post-submission redirect when a form has no custom
# "Redirect to a webpage URL" configured in its form options — every
# HubSpot form embed on this site (homepage contact form + 10 listing
# inquiry forms) falls back to this path on whatever domain it's embedded
# on. Discovered via a live test submission right after the domain cutover
# (2026-08-04): the path never existed here, so it 404'd for every real
# submitter. Sends to the homepage instead until each form gets a proper
# branded thank-you page configured in HubSpot.
[[redirects]]
  from = "/thank-you-for-your-submission/*"
  to = "/"
  status = 302

# Same HubSpot-default-fallback situation as above, but for the "-your-"-less
# variant of the path — confirmed live 404 (2026-08-17) at
# /thank-you-for-submission/, distinct from /thank-you-for-your-submission/
# above. Whatever's linking to this shorter form likely has a typo'd or
# older copy of the fallback path baked in somewhere.
[[redirects]]
  from = "/thank-you-for-submission/*"
  to = "/"
  status = 302

# Redirects for old redthomes.com URLs that don't map 1:1 onto this site's
# structure. /developers/ and /for-rent/ aren't listed here because those
# folder names match exactly and are auto-served by Netlify without a rule.
[[redirects]]
  from = "/our-team/*"
  to = "/team/index.html"
  status = 301

[[redirects]]
  from = "/testimonials/*"
  to = "/#testimonials"
  status = 301

# These 4 posts had emoji-prefixed titles; WordPress's exported slug was
# the literal percent-encoded text (e.g. "%f0%9f%8c%bf-..."), which was
# briefly used as the actual filename here too — any browser decodes that
# in an href/URL bar and 404s, since it doesn't match the literal filename.
# Renamed to clean ASCII slugs (data/blog.json); these redirects catch the
# real old emoji URLs (used by the live WordPress site, and by other posts
# linking to these ones internally) and point them at the new slug.
#
# Must appear BEFORE the generic /blog/:slug/ rule below — Netlify uses the
# first matching rule in file order, and :slug matches any single path
# segment including these, so if the generic rule came first it would win
# and redirect to a literal (nonexistent) "%f0%9f%8c%bf-....html" instead —
# confirmed live via a post-launch redirect audit (2026-08-04), all 4 were
# actually 404ing. Netlify also normalizes percent-encoded octets to
# uppercase hex before matching, so these use uppercase to actually match a
# real browser request (a real browser also always sends uppercase hex).
[[redirects]]
  from = "/blog/%F0%9F%8C%BF-how-to-keep-your-house-cool-without-ac/"
  to = "/blog/how-to-keep-your-house-cool-without-ac.html"
  status = 301
[[redirects]]
  from = "/blog/%E2%9C%85-right-sizing-find-the-space-that-fits-your-life/"
  to = "/blog/right-sizing-find-the-space-that-fits-your-life.html"
  status = 301
[[redirects]]
  from = "/blog/%F0%9F%A7%B3-the-ultimate-moving-checklist-10-steps-to-a-smooth-move/"
  to = "/blog/the-ultimate-moving-checklist-10-steps-to-a-smooth-move.html"
  status = 301
[[redirects]]
  from = "/blog/%F0%9F%94%A5-the-5-hottest-neighborhoods-in-denver-right-now/"
  to = "/blog/the-5-hottest-neighborhoods-in-denver-right-now.html"
  status = 301

